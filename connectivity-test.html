<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COCKTAIL ROOM — проверка связи</title><style>body{font:16px system-ui;padding:18px;max-width:520px;margin:auto;background:#f5f6f7;color:#222}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}button{background:#1a3038;color:#fff}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:12px;border-radius:8px}</style></head>
<body><h2>COCKTAIL ROOM · Проверка связи</h2><p>Тест без чтения или записи в Google Sheets. Используется только отдельный Apps Script /exec, в котором опубликован endpoint connectivity.</p>
<input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
<button id="check">Проверить соединение</button><pre id="result">Ожидание проверки</pre>
<script>
document.getElementById('check').onclick=async()=>{
 const out=document.getElementById('result');
 try{
 const u=new URL(document.getElementById('url').value.trim());
 if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec\/?$/.test(u.pathname))throw Error('Введи адрес тестового /exec');
 u.searchParams.set('view','connectivity');
 out.textContent='Проверяем ответ сервера…';
 const r=await fetch(u.href,{mode:'cors',credentials:'omit',redirect:'follow',cache:'no-store'});
 const body=await r.json();
 out.textContent=JSON.stringify({httpStatus:r.status,response:body},null,2);
 }catch(e){out.textContent='Невозможно прочитать ответ: '+String(e.message||e)+'\nВозможны ограничения CORS, авторизации или сети.'}
};
</script></body></html>
