<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Radio Test"><link rel="manifest" href="./manifest.webmanifest"><title>COCKTAIL ROOM Radio Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101116;color:#f7f7f7;font:16px -apple-system,BlinkMacSystemFont,system-ui;display:flex;justify-content:center;align-items:center;padding:20px}.card{width:100%;max-width:460px;background:#20212a;border-radius:22px;padding:24px}h1{text-align:center;font-size:22px;margin:0}.sub{text-align:center;color:#a5a7b3;font-size:13px;margin:8px 0 24px}.stations{display:grid;grid-template-columns:1fr 1fr;gap:9px}.station,button{touch-action:manipulation;cursor:pointer;border:0;border-radius:11px;padding:14px;color:white;background:#333643;font:inherit}.station.active{background:#244534;color:#8af3a5;outline:1px solid #65d28e}.controls{display:flex;gap:10px;margin-top:19px}.controls button{flex:1;font-weight:650}#play{background:#82e5a4;color:#121b16}.status{text-align:center;min-height:45px;margin-top:20px;color:#cdd0d6}.meta{font-size:12px;color:#b1b5c0;background:#2a2c37;border-radius:10px;padding:14px;line-height:1.6}.note{color:#9aa0ae;font-size:12px;line-height:1.5;margin-top:17px}</style></head><body><main class="card"><h1>RADIO RECORD</h1><div class="sub">COCKTAIL ROOM · тест фона iOS</div><div class="stations" id="stations"></div><div style="text-align:center;margin:23px 0 0;color:#aaa;font-size:12px">ВЫБРАННАЯ СТАНЦИЯ</div><h2 style="text-align:center" id="current">Deep</h2><div class="controls"><button id="play">▶ Слушать</button><button id="stop">■ Стоп</button></div><div id="status" class="status">Готово</div><div class="meta"><div>Режим: <b id="mode">—</b></div><div>Состояние: <b id="state">Остановлено</b></div><div>Время работы: <b id="elapsed">0:00</b></div><div>Скрытие приложения: <b id="hidden">0</b></div></div><div class="note">Включите радио, заблокируйте iPhone на 5–10 минут. Если звук продолжает играть — фоновый режим работает. Сравните с Safari.</div></main><audio id="audio" preload="none"></audio><script>'use strict';const host='https://radiorecord.hostingradio.ru/';const stations=[['Deep','deep96.aacp'],['Megamix','mix96.aacp'],['Big Hits','bighits96.aacp'],['Chill House','chillhouse96.aacp'],['Summer Dance','summerparty96.aacp'],['Beach Party','beach96.aacp'],['VIP House','vip96.aacp'],['Tropical','trop96.aacp']];const el=id=>document.getElementById(id),audio=el('audio');let selected=Number(localStorage.getItem('rr_selected'))||0,started=0,hiddenCount=0,desired=false,retry=null;function update(){el('current').textContent=stations[selected][0];el('stations').innerHTML=stations.map((s,i)=>'<button class="station '+(i===selected?'active':'')+'" data-i="'+i+'">'+s[0]+'</button>').join('');el('play').textContent=desired?'❚❚ Пауза':'▶ Слушать';el('mode').textContent=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone?'Установленное PWA':'Safari / браузер';}function source(){audio.src=host+stations[selected][1]}function play(){clearTimeout(retry);desired=true;update();if(!audio.src)source();audio.play().then(()=>{started=Date.now();el('status').textContent='🟢 Играет: '+stations[selected][0];el('state').textContent='Играет'}).catch(e=>{el('status').textContent='Не удалось запустить: '+e.message;desired=false;update()})}function pause(){desired=false;clearTimeout(retry);audio.pause();el('state').textContent='Пауза';el('status').textContent='Пауза';update()}el('play').onclick=()=>desired?pause():play();el('stop').onclick=()=>{pause();audio.removeAttribute('src');audio.load();el('state').textContent='Стоп';el('status').textContent='Остановлено'};el('stations').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let i=Number(b.dataset.i);if(i===selected)return;selected=i;localStorage.setItem('rr_selected',String(i));let was=desired;audio.pause();source();update();if(was)play()};audio.addEventListener('playing',()=>{el('status').textContent='🟢 Играет';el('state').textContent='Играет'});audio.addEventListener('waiting',()=>{if(desired)el('state').textContent='Ожидание потока'});audio.addEventListener('error',()=>{if(desired){el('state').textContent='Ошибка потока';retry=setTimeout(()=>{if(desired){source();play()}},5000)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenCount++;el('hidden').textContent=hiddenCount});setInterval(()=>{if(started&&desired){let sec=Math.floor((Date.now()-started)/1000);el('elapsed').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}},1000);if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:stations[selected][0],artist:'Radio Record',album:'COCKTAIL ROOM Test'});navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',pause)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});update();</script></body></html>
