name: Verify COCKTAIL ROOM owner PWA
on:
  push:
    branches:
      - main
      - maintenance/single-management-release-20261019
    paths:
      - work.html
      - pwa-workspace-merge.js
      - pwa-owner-sync.js
      - pwa-relay-transport.js
      - secure-work-store.js
      - pwa-work-client.js
      - sw.js
      - manifest.webmanifest
      - index.html
      - tests/**
      - .github/workflows/verify-owner-pwa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and offline shift workflow
        run: |
          node tests/smoke.cjs
          node tests/owner-sync.cjs
          node tests/two-device.cjs
