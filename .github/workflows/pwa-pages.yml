name: Publish COCKTAIL ROOM PWA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - connectivity-test.html
      - transport-test.html
      - secure-sync-test.html
      - app.js
      - work.html
      - pwa-work-client.js
      - pwa-relay-transport.js
      - pwa-owner-sync.js
      - secure-work-store.js
      - db.js
      - shifts-ui.js
      - styles.css
      - sw.js
      - manifest.webmanifest
      - icon.svg
      - .github/workflows/pwa-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static-only site
        run: |
          mkdir -p public
          cp index.html app.js db.js shifts-ui.js styles.css sw.js manifest.webmanifest icon.svg work.html pwa-work-client.js secure-work-store.js pwa-relay-transport.js pwa-owner-sync.js connectivity-test.html transport-test.html secure-sync-test.html public/
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
