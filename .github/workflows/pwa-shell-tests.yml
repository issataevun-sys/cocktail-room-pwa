name: PWA shell regression tests
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sw.js
      - name: Offline shell regression
        run: node --test tests/sw-network-resilience.test.js
